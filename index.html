<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Live Tracker</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Bar / Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="title-row">
          <h1>ESP32 Live Tracker</h1>
          <div id="connectionStatus" class="connection-badge connecting" title="Firebase RTDB Connection Status">
            <span class="dot"></span>
            <span class="status-label">Connecting</span>
          </div>
        </div>
      </div>

      <!-- Mode Switcher -->
      <div class="mode-switch">
        <button id="btnPassenger" class="mode-btn active" data-mode="passenger">Passenger</button>
        <button id="btnAdmin" class="mode-btn" data-mode="admin">Admin</button>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="app-body">
      
      <!-- Map Container -->
      <section class="map-card">
        <div id="map" class="map-view"></div>
        <button id="btnRecenter" class="recenter-floating-btn" title="Center map on tracker">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
          </svg>
          Recenter
        </button>
      </section>

      <!-- Controls & Metrics Section -->
      <section class="controls-section">
        
        <!-- Admin Controls (Admin mode only) -->
        <div id="adminPanel" class="admin-panel hidden">
          <div class="admin-header">
            <h3>Journey Management</h3>
            <span id="journeyStatus" class="journey-status">Polyline hidden</span>
          </div>
          
          <div class="admin-actions">
            <button id="btnShowJourney" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
              </svg>
              Show Current Journey
            </button>

            <button id="btnArchiveJourney" class="btn btn-warning" title="Save current journey to history & clear for next trip">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path>
              </svg>
              Save & Start New Trip
            </button>

            <button id="btnClearJourney" class="btn btn-secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Clear Map Display
            </button>
          </div>

          <!-- Saved Journeys History -->
          <div class="history-select-group">
            <label for="historySelect" class="history-label">View Past Journeys</label>
            <select id="historySelect" class="history-select">
              <option value="">-- Select Saved Journey --</option>
            </select>
          </div>
        </div>

        <!-- Metrics Cards Grid -->
        <div class="metrics-grid">
          
          <!-- Tracker Sharing Status -->
          <div class="metric-card">
            <div class="metric-label">Sharing Status</div>
            <div id="sharingStatus" class="status-indicator stopped">
              <span class="indicator-dot"></span>
              <span id="sharingStatusText" class="indicator-text">STOPPED</span>
            </div>
          </div>

          <!-- Speed -->
          <div class="metric-card">
            <div class="metric-label">Speed</div>
            <div class="metric-value-container">
              <span id="speedVal" class="metric-value">0.0</span>
              <span class="metric-unit">km/h</span>
            </div>
          </div>

          <!-- Satellites -->
          <div class="metric-card">
            <div class="metric-label">Satellites</div>
            <div class="metric-value-container">
              <span id="satsVal" class="metric-value">0</span>
              <span class="metric-unit">sats</span>
            </div>
          </div>

          <!-- HDOP / Accuracy -->
          <div class="metric-card">
            <div class="metric-label">GPS HDOP</div>
            <div class="metric-value-container">
              <span id="hdopVal" class="metric-value">0.0</span>
              <span class="metric-unit">acc</span>
            </div>
          </div>

          <!-- Last Updated -->
          <div class="metric-card full-width">
            <div class="metric-label">Last Updated</div>
            <div id="lastUpdateVal" class="metric-value-text">Waiting for data...</div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Firebase Compat JS (No build tool required) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  
  <!-- Firebase Config (Loaded from config.js) -->
  <script src="config.js"></script>
  
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
